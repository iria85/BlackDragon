function render(){
  if (view.name !== "session") app.style.removeProperty("--c");
  if (view.name === "home") renderHome();
  else if (view.name === "session"){ renderSession(); app.querySelectorAll(".result textarea").forEach(t => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }); }
  else if (view.name === "nutri") renderNutri();
  else if (view.name === "rms") renderRms();
  else if (view.name === "arcList") renderArchList();
  else if (view.name === "arcProg") renderArchProg();
  else if (view.name === "arcDay") renderArchDay();
  else if (view.name === "rutina") renderRutina();
  else if (view.name === "nutriSlot") renderNutriSlot();
  else if (view.name === "boxList") renderBoxList();
  else if (view.name === "boxDay"){ renderBoxDay(); app.querySelectorAll(".result textarea").forEach(t => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }); }
  else renderSettings();
}
function go(v){ view = v; pending = null; render(); window.scrollTo(0, 0); }
function boxBack(){ go(view.from || {name:"boxList"}); }
// Salir de la edición sin guardar: vuelve a la lectura, o fuera si la clase aún no existía.
function boxCancel(){ if (box[view.d]){ view = {...view, draft:null}; render(); window.scrollTo(0, 0); } else boxBack(); }

/* ---------- Copiar ---------- */
function sessionText(){
  const id = view.id, pr = prog(id), d = pr.days[view.i], ds = sessionDates(id);
  const dd = ds && ds[view.i];
  let s = `${pr.name.toUpperCase()} · ENTRENO ${d.n}${dd ? " · " + DIAS_L[dd.getDay()] + " " + fmt(dd) : ""}\n`;
  d.ex.forEach((e, i) => {
    const b = e.pct ? baseFor(e) : null;
    s += `\n${i+1}. ${e.title ? e.title + " · " : ""}${e.name}${b && b.v != null ? ` (RM ${n0(b.v)})` : ""}\n`;
    if (e.pct) parsePct(e.pct).forEach(r => {
      s += r.text ? `   ${r.text}\n` : `   ${n0(r.pct)}% → ${b && b.v != null ? n0(kgFor(b.v, r.pct)) : "?"} kg · ${r.sets}×${r.reps}\n`;
    });
    (e.text ? [].concat(e.text) : []).forEach(l => s += `   ${l}\n`);
    if (e.notes) s += `   Nota: ${e.notes}\n`;
    const rv = resultOf(id, view.i, e, i).trim();
    if (rv) s += `   Resultado: ${rv.split("\n").join(" / ")}\n`;
  });
  return s;
}
function copyText(btn){
  const txt = sessionText();
  const ok = () => { btn.textContent = "Copiado"; setTimeout(() => btn.textContent = "Copiar entreno", 1500); };
  const fb = () => { const ta = document.createElement("textarea"); ta.value = txt; ta.style.cssText = "width:100%;height:220px;margin-top:10px"; btn.parentNode.after(ta); ta.select(); btn.textContent = "Selecciona y copia"; };
  try { navigator.clipboard.writeText(txt).then(ok, fb); } catch(_) { fb(); }
}

/* ---------- Eventos ---------- */
function toggleRow(row){
  const k = row.dataset.k; if (done[k]) delete done[k]; else done[k] = true;
  save("e-done", done); row.classList.toggle("done", !!done[k]); row.setAttribute("aria-checked", !!done[k]);
}
app.addEventListener("click", e => {
  const row = e.target.closest(".row, .tick"); if (row){ toggleRow(row); return; }
  const rb = e.target.closest("[data-act=resedit], [data-act=ressave]");
  if (rb){
    const k = rb.dataset.k, y = window.scrollY;
    if (rb.dataset.act === "resedit") resEdit.add(k); else resEdit.delete(k);
    render(); window.scrollTo(0, y);
    if (rb.dataset.act === "resedit"){ const t = document.querySelector(`[data-res="${k}"]`); if (t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
    return;
  }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "home") go({name:"home"});
  else if (a === "settings") go({name:"settings"});
  else if (a === "rms") go({name:"rms"});
  else if (a === "arclist") go({name:"arcList"});
  else if (a === "arcprog") go({name:"arcProg", id:b.dataset.id || view.id, q:b.dataset.id && b.dataset.id !== view.id ? "" : (view.q || "")});
  else if (a === "arcday") go({name:"arcDay", id:view.id, i:+b.dataset.i, q:view.q || ""});
  else if (a === "rutina") go({name:"rutina", d:iso(todayMid())});
  else if (a === "rutday"){ view = {...view, d:b.dataset.d}; render(); }
  else if (a === "rutck"){
    const k = view.d, id = b.dataset.id, day = rut[k] = rut[k] || {};
    if (day[id]) delete day[id]; else day[id] = true;
    if (!Object.keys(day).length) delete rut[k];
    save("e-rut", rut); render();
  }
  else if (a === "rutadd"){
    const inp = document.getElementById("rut-new"), label = inp.value.trim(); if (!label) return;
    rutItems.push({id:"t" + Date.now().toString(36), label}); save("e-rut-items", rutItems); render();
    const sec = document.getElementById("cfg-rutina"); if (sec) sec.scrollIntoView({block:"center"});
  }
  else if (a === "rutdel"){ rutItems = rutItems.filter(x => x.id !== b.dataset.id); save("e-rut-items", rutItems); render(); }
  else if (a === "rutup"){
    const i = rutItems.findIndex(x => x.id === b.dataset.id);
    if (i > 0){ [rutItems[i - 1], rutItems[i]] = [rutItems[i], rutItems[i - 1]]; save("e-rut-items", rutItems); render(); }
  }
  else if (a === "open") go({name:"session", id:b.dataset.id, i:currentIdx(b.dataset.id)});
  else if (a === "prev" && view.i > 0) go({...view, i:view.i - 1});
  else if (a === "next" && view.i < prog(view.id).days.length - 1) go({...view, i:view.i + 1});
  else if (a === "go") go({...view, i:+b.dataset.i});
  else if (a === "jump") go({...view, i:currentIdx(view.id)});
  else if (a === "copy") copyText(b);
  else if (a === "timer"){
    const ei = +b.dataset.ei, ex = prog(view.id).days[view.i].ex[ei];
    tmOpen(timerFor(ex), (ex.title ? ex.title + " · " : "") + ex.name, {id:view.id, di:view.i, ei});
  }
  else if (a === "pp"){ pending = b.dataset.kind; render(); }
  else if (a === "ppno"){ pending = null; render(); }
  else if (a === "pin"){
    const v = document.getElementById("pin-date").value; if (!v) return;
    pins[view.id] = {...(pins[view.id] || {}), [view.i]: v}; save("e-pin", pins);
    // Si había un día marcado como no hecho en esa fecha para este perfil, ya no aplica.
    skips[view.id] = (skips[view.id] || []).filter(x => x !== v); save("e-skip", skips);
    render();
  }
  else if (a === "unpin"){
    if (pins[view.id]){ delete pins[view.id][view.i]; save("e-pin", pins); }
    render();
  }
  else if (a === "ppok"){
    const k = iso(sessionDates(view.id)[view.i]), kind = pending;
    skips[view.id] = [...new Set([...(skips[view.id] || []), k])].sort(); save("e-skip", skips);
    if (kind === "box"){ box[k] = box[k] || {}; save("e-box", box); go({name:"boxDay", d:k, draft:{...box[k]}, from:{name:"session", id:view.id, i:view.i}}); }
    else if (kind.startsWith("other:")){
      const other = kind.slice(6);
      extras[other] = [...new Set([...(extras[other] || []), k])].sort(); save("e-extra", extras);
      const oi = (sessionDates(other) || []).findIndex(x => x && iso(x) === k);
      go({name:"session", id:other, i:oi >= 0 ? oi : currentIdx(other)});
    }
    else { pending = null; render(); }
  }
  else if (a === "unskip"){
    const k = b.dataset.d; skips[view.id] = (skips[view.id] || []).filter(x => x !== k); save("e-skip", skips);
    PROFILES.forEach(p => { if (p.id !== view.id && extras[p.id]) extras[p.id] = extras[p.id].filter(x => x !== k); }); save("e-extra", extras);
    render();
  }
  else if (a === "unextra"){
    const k = b.dataset.d; extras[view.id] = (extras[view.id] || []).filter(x => x !== k); save("e-extra", extras);
    PROFILES.forEach(p => { if (p.id !== view.id && skips[p.id]) skips[p.id] = skips[p.id].filter(x => x !== k); }); save("e-skip", skips);
    render();
  }
  else if (a === "boxlist") go({name:"boxList"});
  else if (a === "boxday"){ e.preventDefault(); go({name:"boxDay", d:b.dataset.d, from:view.name === "session" ? {...view} : null}); }
  else if (a === "boxback") view.draft ? boxCancel() : boxBack();
  else if (a === "boxadd"){ const k = document.getElementById("boxnew").value; if (!k) return; go({name:"boxDay", d:k, draft:{...(box[k] || {})}}); }
  else if (a === "scan"){ view = {...view, scanMsg:"Abriendo…"}; render(); window.Android.scanBoard(b.dataset.src); }
  else if (a === "boxedit"){ view = {...view, scanMsg:"", draft:{...(box[view.d] || {})}}; render(); }
  else if (a === "boxsave"){ box[view.d] = view.draft; save("e-box", box); view = {...view, draft:null}; render(); window.scrollTo(0, 0); }
  else if (a === "boxcancel") boxCancel();
  else if (a === "boxdel"){
    if (b.dataset.sure){ delete box[view.d]; save("e-box", box); boxBack(); }
    else { b.dataset.sure = 1; b.textContent = "Toca otra vez para borrar"; }
  }
  else if (a === "resetrm"){ rm = rmDefaults(); save("e-rm", {}); render(); }
  else if (a === "nutri") go({name:"nutri", d:nutToday()});
  else if (a === "nprev" || a === "nnext"){ const days = nutDays(), j = days.indexOf(view.d) + (a === "nnext" ? 1 : -1); if (days[j]) go({name:"nutri", d:days[j]}); }
  else if (a === "slot") go({name:"nutriSlot", d:view.d, slot:b.dataset.slot});
  else if (a === "nback") go({name:"nutri", d:view.d});
  else if (a === "pickdes" || a === "pickcom"){
    const s = nut[view.d] = nut[view.d] || {};
    if (a === "pickdes") s.des = b.dataset.k; else s.com = b.dataset.p;
    save("e-nut", nut); go({name:"nutri", d:view.d});
  }
  else if (a === "bkcopy"){
    const txt = JSON.stringify({app:"entrenos", v:1, rm:load("e-rm", {}), bar:barKg, step, pcfg, done, res, nut, skip:skips, box, extra:extras, sets:setProg, migCf:true, rut, rutItems, rmDate, pin:pins});
    const msg = document.getElementById("bk-msg"), ta = document.getElementById("bk-in");
    const ok = () => { msg.textContent = "Copiado al portapapeles"; };
    const fb = () => { ta.value = txt; ta.select(); msg.textContent = "Selecciona el texto y cópialo"; };
    try { navigator.clipboard.writeText(txt).then(ok, fb); } catch(_) { fb(); }
  }
  else if (a === "bkrestore"){
    const msg = document.getElementById("bk-msg");
    try {
      const d = JSON.parse(document.getElementById("bk-in").value);
      if (d.app !== "entrenos") throw 0;
      save("e-rm", d.rm || {}); save("e-bar", d.bar || 20); save("e-step", d.step || 1);
      save("e-pcfg", d.pcfg || {}); save("e-done", d.done || {}); save("e-res", d.res || {}); save("e-nut", d.nut || {});
      save("e-skip", d.skip || {}); save("e-box", d.box || {}); save("e-extra", d.extra || {}); save("e-sets", d.sets || {});
      save("e-rut", d.rut || {}); save("e-pin", d.pin || {}); if (d.rutItems) save("e-rut-items", d.rutItems); save("e-rmdate", d.rmDate || {});
      rm = Object.assign(rmDefaults(), d.rm || {}); barKg = d.bar || 20; step = d.step || 1;
      pcfg = d.pcfg || {}; done = d.done || {}; res = d.res || {}; nut = d.nut || {};
      skips = d.skip || {}; box = d.box || {}; extras = d.extra || {}; setProg = d.sets || {};
      rut = d.rut || {}; pins = d.pin || {}; if (d.rutItems) rutItems = d.rutItems; rmDate = d.rmDate || {};
      // Copia anterior a los entrenamientos completos de CrossFit: recargar para recolocar sus resultados.
      if (!d.migCf){ save("e-mig-cf-full", false); location.reload(); return; }
      render(); document.getElementById("bk-msg").textContent = "Datos restaurados";
    } catch(_) { msg.textContent = "Ese texto no es una copia de Entrenos. Pega la copia completa."; }
  }
});
app.addEventListener("keydown", e => {
  const row = e.target.closest && e.target.closest(".row, .tick");
  if (row && (e.key === " " || e.key === "Enter")){ e.preventDefault(); toggleRow(row); }
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "pick") go({...view, i:+t.value});
  else if (t.id === "npick") go({name:"nutri", d:t.value});
  else if (t.id === "bar"){ barKg = +t.value; save("e-bar", barKg); }
  else if (t.id === "step"){ step = +t.value; save("e-step", step); }
  else if (t.dataset.wd){
    const id = t.dataset.wd, c = cfgOf(id);
    const set = new Set(c.weekdays); t.checked ? set.add(+t.value) : set.delete(+t.value);
    pcfg[id] = {...c, weekdays:[...set]}; save("e-pcfg", pcfg);
  } else if (t.dataset.start){
    const id = t.dataset.start; pcfg[id] = {...cfgOf(id), start:t.value || null}; save("e-pcfg", pcfg);
  }
});
let arcT = null;
app.addEventListener("input", e => {
  if (e.target.id === "arc-q"){
    const v = e.target.value; clearTimeout(arcT);
    arcT = setTimeout(() => { view = {...view, q:v}; render(); const i = document.getElementById("arc-q"); if (i){ i.focus(); i.setSelectionRange(v.length, v.length); } }, 250);
    return;
  }
  if (e.target.dataset.box){
    const t = e.target; view.draft[t.dataset.box] = t.value;
    if (t.tagName === "TEXTAREA"){ t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
    return;
  }
  if (e.target.dataset.res){
    const t = e.target; res[t.dataset.res] = t.value; save("e-res", res);
    t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; return;
  }
  if (e.target.dataset.rutlabel){
    const it = rutItems.find(x => x.id === e.target.dataset.rutlabel);
    if (it){ it.label = e.target.value; save("e-rut-items", rutItems); }
    return;
  }
  const k = e.target.dataset.rm; if (!k) return;
  const v = parseFloat(e.target.value);
  rm[k] = v > 0 ? v : null;
  rmDate[k] = iso(todayMid()); save("e-rmdate", rmDate);
  const diff = {}; RM_DEF.forEach(r => { if (rm[r.k] !== r.v) diff[r.k] = rm[r.k]; });
  save("e-rm", diff);
  const cj = document.getElementById("rm-cj"); if (cj) cj.value = rmOf("cj") ?? "";
});

// Llamado por el botón atrás de Android: true = gestionado dentro de la app.
window.appBack = () => {
  // Con el timer abierto: si está corriendo, el primer atrás lo pausa; el siguiente lo cierra.
  if (tm){ if (tm.state === "run") tmPause(); else tmClose(); return true; }
  if (view.name === "home") return false;
  if (view.name === "boxDay"){ view.draft ? boxCancel() : boxBack(); return true; }
  if (view.name === "arcDay"){ go({name:"arcProg", id:view.id, q:view.q || ""}); return true; }
  if (view.name === "arcProg"){ go({name:"arcList"}); return true; }
  go(view.name === "nutriSlot" ? {name:"nutri", d:view.d} : {name:"home"}); return true;
};

render();
</script>
</body>
</html>
