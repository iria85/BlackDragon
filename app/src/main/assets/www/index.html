<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Black Dragon</title>
<style>
/* Layout: app de una columna para el móvil. Inicio con los dos perfiles → sesión del día (rampa de series, kg y discos) → ajustes con RMs compartidos. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --ink:#15191f; --muted:#5d6672; --line:#d5dae0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --done:#e6ecf8; --warn:#9a5b00;
  --cf:#c2410c; --nut:#15803d; --box:#7c3aed; --rmc:#b45309; --rut:#0f766e; --arc:#475569;
  --pred:#d32f2f; --pblue:#1d4ed8; --pyellow:#e8b400; --pgreen:#2e7d32; --pgrey:#7b8490; --pwhite:#f4f4f4;
  --display:"Barlow Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif;
  --body:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101318; --surface:#181d24; --ink:#e9edf2; --muted:#98a2ae; --line:#2a313b;
  --accent:#6f9bff; --accent-ink:#0b1020; --done:#1c2638; --warn:#f0b04a; --cf:#fb923c; --nut:#4ade80; --box:#a78bfa; --rmc:#fbbf24; --rut:#2dd4bf; --arc:#94a3b8;
  --pwhite:#e9edf2; --pgrey:#6c7682; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 16px;padding-block:env(safe-area-inset-top,0px) 48px}
button{font-family:var(--body)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Barra superior */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.bar button{font:600 15px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;height:40px;min-width:40px;padding:0 12px;cursor:pointer}
.bar button:disabled{opacity:.35}
.bar .mid{flex:1;min-width:0;text-align:center}
.bar select{font:700 20px var(--display);letter-spacing:.02em;text-transform:uppercase;background:transparent;color:var(--ink);border:0;max-width:100%;text-align:center}
.bar .ttl{font:700 20px var(--display);text-transform:uppercase;letter-spacing:.04em}
.when{font-size:13px;color:var(--muted)}
.when b{color:var(--accent);font-weight:600}

/* Inicio */
.brand{padding-block:28px 8px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font:800 40px/.95 var(--display);margin:0}
.brand p{margin:4px 0 0;color:var(--muted)}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.gear.rm{border-color:var(--rmc);color:var(--rmc)}
.gear.arc{border-color:var(--arc);color:var(--arc)}
.gear{font:600 15px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;height:40px;padding:0 12px;cursor:pointer;flex-shrink:0}
.profiles{display:grid;gap:14px;margin-top:18px}
.prof{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px;cursor:pointer;color:var(--ink);position:relative;overflow:hidden}
.prof::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.prof .kind{font:600 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.prof h2{font:800 34px/1 var(--display);margin:4px 0 6px;text-transform:uppercase}
.prof .next{font-size:15px}
.prof .next b{font-weight:600}
.prof .sub{font-size:13px;color:var(--muted);margin-top:2px}
.prof .progress{margin-top:12px}
.prof.empty h2{color:var(--muted)}

/* Sesión */
header.day{padding-block:22px 6px}
.eyebrow{font:600 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.day h1{font:800 clamp(40px,11vw,60px)/.95 var(--display);margin:4px 0 8px;text-transform:uppercase}
.day h1 small{font-size:.45em;color:var(--muted);font-weight:600;letter-spacing:.06em}
.desc{color:var(--muted);margin:0 0 6px;max-width:60ch}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--c,var(--accent))}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:16px;overflow:hidden}
.ex-h{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 10px}
.num{font:800 30px/1 var(--display);color:var(--c,var(--accent));min-width:22px}
.ex-h > div{min-width:0}
.ex h2{font:700 22px/1.05 var(--display);margin:0;text-transform:uppercase;letter-spacing:.01em}
.extitle{font:600 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--accent));margin-bottom:2px}
.result{margin:0;padding:10px 14px 12px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted);display:grid;gap:2px}
.result .rl{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.result textarea{font:15px/1.4 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;resize:none;overflow:hidden;margin-top:4px}
.result textarea::placeholder{color:var(--muted)}
.backup textarea{font:12px/1.3 ui-monospace,monospace;width:100%;height:110px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.ok{font-size:13px;color:var(--muted)}
.base{font-size:13px;color:var(--muted);margin-top:3px}
.base.miss{color:var(--warn)}
.note{margin:0 14px 10px;padding:8px 10px;border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);font-size:14px;border-radius:0 6px 6px 0}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:48px 64px 1fr;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.row:last-child{border-bottom:0}
.row.done{background:var(--done)}
.row.done .kg,.row.done .sr{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.pct{font:600 15px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.kg{font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
.kg small{font-size:14px;font-weight:600;color:var(--muted);margin-left:1px}
.right{min-width:0;display:flex;flex-direction:column;gap:5px}
.sr{font:700 17px var(--display);letter-spacing:.02em}
.sr span{color:var(--muted);font-weight:500;font-family:var(--body);font-size:13px;letter-spacing:0;margin-left:4px}
.plates{display:flex;flex-wrap:wrap;gap:3px;align-items:center;font-size:12px;color:var(--muted)}
.pl{display:inline-flex;align-items:center;justify-content:center;height:20px;min-width:24px;padding:0 4px;border-radius:3px;font:700 12px var(--display);color:#fff;font-variant-numeric:tabular-nums}
.pl.red{background:var(--pred)} .pl.blue{background:var(--pblue)} .pl.yellow{background:var(--pyellow);color:#1b1b1b} .pl.green{background:var(--pgreen)}
.pl.grey{background:var(--pgrey)} .pl.white{background:var(--pwhite);color:#1b1b1b;border:1px solid var(--line)} .pl.sm{min-width:20px;height:16px}
/* Dibujo de la barra cargada */
.barsvg{display:block;width:100%;max-width:240px;height:auto;margin-top:2px}
.barsvg .metal{fill:var(--muted)}
.barsvg .clip{fill:var(--ink)}
.barsvg .bp{stroke:rgba(0,0,0,.25);stroke-width:.6}
.barsvg .bp.red{fill:var(--pred)} .barsvg .bp.blue{fill:var(--pblue)} .barsvg .bp.yellow{fill:var(--pyellow)} .barsvg .bp.green{fill:var(--pgreen)}
.barsvg .bp.grey{fill:var(--pgrey)} .barsvg .bp.white{fill:var(--pwhite);stroke:var(--muted)}
.row.done .barsvg{opacity:.45}
/* Calentamiento, movilidad y accesorios: más discretos que la fuerza y el WOD */
.ex.prep{background:transparent;border-style:dashed}
.ex.prep h2{font-size:18px;color:var(--muted)}
.ex.prep .num{font-size:22px;color:var(--muted)}
.ex.prep .textrow{font-size:14px;padding-block:6px;color:var(--muted)}
/* Archivo */
.arcsum{font-size:13px;color:var(--muted);margin-top:4px}
.arcres{margin-top:2px;font-size:13px;color:var(--ink)}
.arcmonth{font:700 16px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 0}
.arcsearch{margin-top:16px}
.arcsearch input{font:500 16px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
/* Mis RMs */
.rmgrid{display:grid;gap:12px;margin-top:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.rmcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;min-width:0}
.rmcard .rlab{font:600 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--rmc)}
.rmcard .rk{font:800 46px/1 var(--display);font-variant-numeric:tabular-nums}
.rmcard .rk small{font-size:16px;color:var(--muted);margin-left:3px}
.rmcard.empty .rk{color:var(--muted);font-size:30px}
.rmcard .barsvg{max-width:100%}
.rmcard .rmeta{font-size:12px;color:var(--muted)}
/* Rutina diaria */
.rutnav{display:flex;align-items:center;gap:10px;margin-top:18px}
.rutnav button{font:600 18px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;width:40px;height:40px;cursor:pointer}
.rutnav button:disabled{opacity:.35}
.rutnav .mid{flex:1;text-align:center}
.rutnav .mid b{display:block;font:800 26px/1.05 var(--display);text-transform:uppercase}
.rutnav .mid span{font-size:14px;color:var(--muted)}
.ruts{display:grid;gap:8px;margin-top:14px}
.rutck{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--ink);font:500 17px var(--body);cursor:pointer}
.rutck .bx{width:26px;height:26px;border-radius:7px;border:2px solid var(--rut);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.rutck.on{background:color-mix(in srgb,var(--rut) 12%,var(--surface));border-color:var(--rut)}
.rutck.on .bx{background:var(--rut)}
.rutck.on .bx::after{content:"";width:7px;height:13px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.rutck.on .lb{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 40%,transparent)}
.rutweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px}
.rutweek button{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 2px;color:var(--ink);cursor:pointer;font:600 12px var(--body)}
.rutweek button.cur{border-color:var(--rut);box-shadow:inset 0 0 0 1px var(--rut)}
.rutweek .meter{width:70%;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.rutweek .meter i{display:block;height:100%;background:var(--rut)}
.rutweek b{font:800 17px var(--display)}
.rutedit{display:grid;gap:8px}
.rutrow{display:flex;gap:6px;align-items:center}
.rutrow input{flex:1;min-width:0;font:500 16px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.rutrow button{width:38px;height:38px;flex-shrink:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer;font:600 15px var(--body)}
.textrow{padding:9px 14px;border-bottom:1px solid var(--line);font-size:15px}
.textrow:last-child{border-bottom:0}
.tick{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.tick .tk{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tick .tl{min-width:0}
.tick.done{background:var(--done)}
.tick.done .tk{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.tick.done .tk::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick.done .tl{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{font:600 15px var(--body);border:1px solid var(--c,var(--accent));background:var(--c,var(--accent));color:var(--accent-ink);border-radius:8px;padding:10px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--c,var(--accent))}
.hint{font-size:13px;color:var(--muted);margin-top:10px}
.list{margin-top:28px}
.list h3,.cfg h3{font:700 18px var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.cal button{font:500 13px var(--body);text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 8px;cursor:pointer;font-variant-numeric:tabular-nums}
.cal button b{display:block;font:700 16px var(--display)}
.cal button.cur{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.cal button.past{opacity:.55}
.emptybox{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px 16px;margin-top:22px;color:var(--muted)}
.emptybox b{color:var(--ink)}
/* Aplazar sesión y clases del box */
.pp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:16px}
.pp summary{cursor:pointer;list-style:none;font:700 18px var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--c,var(--accent))}
.pp summary::-webkit-details-marker{display:none}
.pp p{margin:10px 0;font-size:14px;color:var(--muted)}
.pp p b{color:var(--ink);font-weight:600}
.skips{display:grid;gap:6px;margin-top:8px}
.skip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 4px 4px 10px;font-size:14px}
.skip span{min-width:0}
.skip button{font:600 13px var(--body);border:0;background:none;color:var(--c,var(--accent));cursor:pointer;padding:8px;flex-shrink:0}
.ex .field{padding:12px 14px 0}
/* Timer */
.ex-h > .tbtn{margin-left:auto}
.tbtn{display:inline-flex;align-items:center;gap:5px;flex-shrink:0;font:700 14px var(--display);letter-spacing:.02em;text-transform:uppercase;border:1px solid var(--c,var(--accent));background:transparent;color:var(--c,var(--accent));border-radius:8px;padding:6px 9px;cursor:pointer;max-width:150px;text-align:left;line-height:1.1}
.tbtn svg{width:16px;height:16px;flex-shrink:0}
.tm{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px 24px;overflow-y:auto}
.tm[hidden]{display:none}
.tm-top{display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.tm-top .ttl{flex:1;min-width:0;font:700 20px var(--display);text-transform:uppercase;letter-spacing:.04em}
.tm-top .ttl small{display:block;font:500 13px var(--body);text-transform:none;letter-spacing:0;color:var(--muted)}
.tm-top button{font:600 18px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;width:40px;height:40px;cursor:pointer;flex-shrink:0}
.tm-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding-block:20px}
.tm-name{font:800 30px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--c,var(--accent))}
.tm.prep .tm-name{color:var(--warn)} .tm.rest .tm-name{color:var(--muted)}
.tm-sub{font-size:16px;color:var(--muted);min-height:1.45em}
.tm-clock{font:800 clamp(96px,32vw,200px)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tm.paused .tm-clock{opacity:.45}
.tm-next{font-size:14px;color:var(--muted);min-height:1.45em}
.tm .progress{width:100%;max-width:420px;height:6px;margin-top:14px}
.tm-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tm-btns .btn{min-width:110px;padding:14px 18px;font-size:17px}
.tm-plan{width:100%;max-width:420px;display:grid;gap:6px;margin-top:6px;text-align:left}
.tm-plan div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:15px;display:flex;justify-content:space-between;gap:10px}
.tm-plan .r{color:var(--muted)}
.tm-adj{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.tm-adj .field{align-items:center}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 20px var(--body);cursor:pointer}
.step b{min-width:64px;font:800 28px var(--display);font-variant-numeric:tabular-nums}
/* Contador de series en el descanso */
.sdots{display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:center;margin-top:12px;max-width:420px}
.sdots .g{display:flex;flex-direction:column;align-items:center;gap:4px}
.sdots .g small{font:600 12px var(--display);color:var(--muted);letter-spacing:.04em}
.sdots .g span{display:flex;gap:5px}
.sdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--c,var(--accent));box-sizing:border-box}
.sdots i.d{background:var(--c,var(--accent))}
.sdots i.cur{outline:3px solid color-mix(in srgb,var(--c,var(--accent)) 35%,transparent);outline-offset:2px}
.tm-kg{font:800 clamp(72px,24vw,150px)/1 var(--display);font-variant-numeric:tabular-nums}
.tm-kg small{font-size:.35em;color:var(--muted);margin-left:4px}
.tm-main .plates{justify-content:center}
.tm-main .barsvg{margin:6px auto 0;max-width:300px}
.result .rv{font-size:15px;color:var(--ink);margin-top:2px}
.result .rv .none{color:var(--muted)}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.ibtn{width:38px;height:38px;flex-shrink:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--c,var(--accent));display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ibtn svg{width:19px;height:19px}
.ibtn.save{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--accent-ink)}
.boxadd{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:18px}
.boxadd input{font:600 16px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);height:42px}

/* Ajustes */
.cfg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 14px;margin-top:16px;display:grid;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{font:600 16px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.est{font-size:12px;color:var(--warn)}
.wd{display:flex;gap:6px;flex-wrap:wrap}
.wd label{display:inline-flex;position:relative}
.wd input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.wd span{display:inline-flex;align-items:center;justify-content:center;width:40px;height:36px;border:1px solid var(--line);border-radius:6px;font:700 15px var(--display);background:var(--bg);cursor:pointer}
.wd input:checked + span{background:var(--c);border-color:var(--c);color:var(--accent-ink)}
.wd input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.pcfg{border-left:4px solid var(--c);padding-left:12px;display:grid;gap:10px}
.pcfg h4{margin:0;font:700 20px var(--display);text-transform:uppercase;color:var(--c)}
/* Nutrición */
.slots{display:grid;gap:10px;margin-top:16px}
.slot{display:grid;grid-template-columns:52px 1fr;column-gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px;color:var(--ink);cursor:pointer;font-family:var(--body)}
.slot .hora{grid-row:1/3;align-self:center;font:700 15px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.slot .sl{font:700 20px var(--display);text-transform:uppercase;letter-spacing:.02em}
.slot .sv{font-size:14px}
.slot.pending{border-left-color:var(--line)}
.slot.pending .sv{color:var(--muted)}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:16px;display:grid;gap:12px}
.opt.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.opt > .btn{justify-self:start}
.dish h3{font:700 22px/1.05 var(--display);margin:0 0 10px;text-transform:uppercase}
.ing{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:15px}
.ing .q{font-weight:700;font-variant-numeric:tabular-nums}
.xch{margin-top:3px;padding-left:10px;border-left:2px solid var(--line);font-size:13px;color:var(--muted);display:grid;gap:1px}
.xch b{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase}
.recipe{margin-top:12px}
.recipe summary{display:inline-block;list-style:none;font:600 14px var(--body);color:var(--c);border:1px solid var(--c);border-radius:8px;padding:7px 12px;cursor:pointer}
.recipe summary::-webkit-details-marker{display:none}
.recipe[open] summary{background:var(--c);color:var(--accent-ink)}
.recipe ol{margin:10px 0 0;padding-left:22px;display:grid;gap:6px;font-size:15px}
.link{font-size:14px;color:var(--muted)}
.link b{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}}

<body>
<div class="wrap" id="app"></div>
<div class="tm" id="tm" role="dialog" aria-modal="true" aria-label="Timer" hidden></div>

<script src="programs/halterofilia.js"></script>
<script src="programs/crossfit.js"></script>
<script>
/* ---------- Datos fijos ---------- */
const PROFILES = [
  { id:"halterofilia", kind:"Perfil", color:"var(--accent)" },
  { id:"crossfit",     kind:"Perfil", color:"var(--cf)" }
];
// RMs compartidos por los dos perfiles. null = sin dato todavía.
const RM_DEF = [
  {k:"snatch",      label:"Snatch / Power Snatch", v:40},
  {k:"muscle",      label:"Muscle Snatch",         v:30},
  {k:"powerclean",  label:"Power Clean",           v:59},
  {k:"clean",       label:"Squat Clean",           v:55},
  {k:"jerk",        label:"Jerk",                  v:52},
  {k:"pushpress",   label:"Push Press",            v:52},
  {k:"pushjerk",    label:"Push Jerk",             v:55},
  {k:"back",        label:"Back Squat",            v:70},
  {k:"front",       label:"Front Squat",           v:60, est:"Estimado (≈85 % del back squat). Pon el tuyo."},
  {k:"deadlift",    label:"Deadlift",              v:105},
  {k:"strictpress", label:"Strict Press",          v:null},
  {k:"bench",       label:"Bench Press",           v:null},
  {k:"thruster",    label:"Thruster",              v:null}
];
const RM_LABEL = Object.fromEntries(RM_DEF.map(r => [r.k, r.label])); RM_LABEL.cj = "Clean & Jerk";
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DIAS_L = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const DIAS_C = ["D","L","M","X","J","V","S"];
const WD_ORDER = [1,2,3,4,5,6,0];

/* ---------- Estado (localStorage dentro de la app) ---------- */
function load(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const rmDefaults = () => Object.fromEntries(RM_DEF.map(r => [r.k, r.v]));
let rm = Object.assign(rmDefaults(), load("e-rm", {}));
let barKg = load("e-bar", 20), step = load("e-step", 1);
let pcfg = load("e-pcfg", {});         // {perfil: {start, weekdays}}
let done = load("e-done", {});         // {"perfil|dia|ej|serie": true}
let res = load("e-res", {});           // {"perfil|dia|ej": "texto"} resultados escritos en la app
const resKey = (id, di, ei) => `${id}|${di}|${ei}`;
function resultOf(id, di, e, ei){ const k = resKey(id, di, ei); return k in res ? res[k] : (e.result ? [].concat(e.result).join("\n") : ""); }
let nut = load("e-nut", {});           // {"2026-10-05": {des:"bowlChoc+pulga", com:"a"}} elecciones de nutrición
let skips = load("e-skip", {});        // {perfil: ["2026-10-02", …]} días en que no se hizo la programación
let pins = load("e-pin", {});          // {perfil: {"índice de sesión": "2026-10-05"}} fechas fijadas a mano
let extras = load("e-extra", {});      // {perfil: ["2026-10-05", …]} días en que se adelantó una sesión de este perfil en lugar de la del otro
let rmDate = load("e-rmdate", {});     // {rm: "2026-10-05"} última vez que se cambió cada RM
// Rutina diaria: lista de tareas editable y lo marcado cada día.
const RUT_DEF = [
  {id:"entreno", label:"Entrenar"},
  {id:"movil",   label:"Movilidad o estiramientos"},
  {id:"agua",    label:"Beber 2 litros de agua"},
  {id:"nutri",   label:"Comer según el plan"},
  {id:"supl",    label:"Suplementos"},
  {id:"dormir",  label:"Dormir 8 horas"}
];
let rutItems = load("e-rut-items", null) || RUT_DEF.map(x => ({...x}));
let rut = load("e-rut", {});           // {"2026-10-05": {entreno:true, …}}
let setProg = load("e-sets", {});
// Limpieza (una vez): los «no hice» y «días extra» anteriores al 7 de octubre de 2026 venían de un fallo
// (usaban la fecha de la sesión en vez de la de hoy) y descolocaban las fechas. Las fechas reales ya están
// en crossfit.js y en las fechas fijas, así que se quitan.
(function cleanOldShifts(){
  if (load("e-mig-fix-1007", false)) return;
  const cut = "2026-10-07";
  Object.keys(skips).forEach(id => { skips[id] = skips[id].filter(k => k >= cut); });
  Object.keys(extras).forEach(id => { extras[id] = extras[id].filter(k => k >= cut); });
  save("e-skip", skips); save("e-extra", extras); save("e-mig-fix-1007", true);
})();      // {"perfil|dia|ej": nº de series hechas} para el contador de series del timer
// Migración (una vez): al añadir calentamientos a CrossFit los bloques cambiaron de posición.
// Cada bloque antiguo lleva "oi" (su posición anterior); movemos resultados, series hechas y contador a la nueva.
(function migrateCrossfitFull(){
  if (load("e-mig-cf-full", false)) return;
  const pr = (window.PROGRAMS || {}).crossfit;
  if (!pr || !pr.days.some(d => d.ex.some(x => x.oi != null))) return;
  const remap = obj => {
    const out = {};
    Object.keys(obj).forEach(k => {
      const p = k.split("|");
      if (p[0] !== "crossfit" || p.length < 3){ out[k] = obj[k]; return; }
      const d = pr.days[+p[1]], ni = d ? d.ex.findIndex(x => x.oi === +p[2]) : -1;
      if (ni < 0){ out[k] = obj[k]; return; }
      p[2] = String(ni); out[p.join("|")] = obj[k];
    });
    return out;
  };
  res = remap(res); done = remap(done); setProg = remap(setProg);
  save("e-res", res); save("e-done", done); save("e-sets", setProg); save("e-mig-cf-full", true);
})();
let box = load("e-box", {});           // {"2026-10-02": {fuerza, fuerzaRes, tipo, wod, wodRes}} clases del box anotadas
let view = {name:"home"};              // home | session | settings | nutri | nutriSlot | boxList | boxDay
let pending = null;                    // "skip" | "box" mientras se confirma aplazar una sesión

function prog(id){ return (window.PROGRAMS || {})[id] || {name:id, days:[], defaults:{}}; }
function cfgOf(id){
  const d = prog(id).defaults || {};
  const c = Object.assign({start:d.start || null, weekdays:d.weekdays || []}, pcfg[id] || {});
  return c;
}

/* ---------- Fechas ---------- */
function parseDate(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function todayMid(){ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function iso(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
const fmt = d => d.getDate() + " " + MESES[d.getMonth()] + " " + d.getFullYear();
const fmtS = d => d.getDate() + " " + MESES[d.getMonth()];
// Fecha de cada sesión: la fijada en el programa ("date") o la siguiente según los días elegidos en ajustes.
// Los días aplazados (skips) no tienen sesión: la que caía ahí y las siguientes pasan al próximo día de entreno.
// extraSkip simula aplazar un día más (para enseñar la nueva fecha antes de confirmar).
// Los días extra (extras) adelantan la siguiente sesión pendiente a ese día; las de detrás ocupan el hueco de la anterior.
// extraAdd simula un día extra más.
function sessionDates(id, extraSkip, extraAdd){
  const days = prog(id).days, c = cfgOf(id); if (!days.length) return null;
  const skip = new Set(skips[id] || []); if (extraSkip) skip.add(extraSkip);
  const train = dt => { for (let g = 0; c.weekdays.length && !c.weekdays.includes(dt.getDay()) && g < 14; g++) dt.setDate(dt.getDate() + 1); return dt; };
  const nextDay = dt => { const n = new Date(dt); n.setDate(n.getDate() + 1); return n; };
  const out = []; let cursor = c.start ? parseDate(c.start) : null, prev = null, any = false;
  const pin = pins[id] || {};
  for (let i = 0; i < days.length; i++){
    const d = days[i]; let dt;
    if (pin[i]) dt = parseDate(pin[i]);   // fecha fijada a mano: manda sobre todo lo demás
    else {
      if (d.date){ dt = parseDate(d.date); if (prev && dt <= prev) dt = train(nextDay(prev)); }
      else if (cursor && c.weekdays.length) dt = train(new Date(cursor));
      else { out.push(null); continue; }
      while (skip.has(iso(dt))) dt = train(nextDay(dt));
    }
    out.push(dt); any = true; prev = dt; cursor = nextDay(dt);
  }
  if (!any) return null;
  const adds = [...new Set([...(extras[id] || []), ...(extraAdd ? [extraAdd] : [])])].sort();
  // Las sesiones con fecha fija no se mueven: los días extra solo recolocan las demás.
  const free = out.map((x, i) => x && !pin[i] ? i : -1).filter(i => i >= 0);
  adds.forEach(k => {
    const E = parseDate(k);
    if (out.some(x => x && +x === +E)) return;
    const fj = free.findIndex(i => out[i] > E); if (fj === -1) return;
    const j = free[fj];
    if (Object.keys(pin).some(pi => +pi < j && parseDate(pin[pi]) >= E)) return;   // quedaría antes de una sesión fijada
    for (let m = free.length - 1; m > fj; m--) out[free[m]] = out[free[m - 1]];
    out[j] = E;
  });
  return out;
}
const otherProfiles = id => PROFILES.filter(p => p.id !== id && prog(p.id).days.length);
// Quién hizo qué ese día: si en `id` se aplazó el día k porque se hizo otro perfil, devuelve ese perfil.
const extraOwner = (id, k) => PROFILES.find(p => p.id !== id && (extras[p.id] || []).includes(k));
function currentIdx(id){
  const ds = sessionDates(id); if (!ds) return 0;
  const t = todayMid();
  let i = ds.findIndex(d => d && d >= t);
  if (i === -1) i = ds.findIndex(d => !d);
  return i === -1 ? ds.length - 1 : i;
}

/* ---------- Cálculo de pesos ---------- */
function lift(c){
  if (/MUSCLE SNATCH/.test(c)) return "muscle";
  if (/SNATCH|OHS|OVERHEAD SQUAT/.test(c)) return "snatch";
  if (/CLEAN\s*(&|AND)\s*JERK/.test(c)) return "cj";
  if (/THRUSTER/.test(c)) return "thruster";
  if (/DEADLIFT|PESO MUERTO/.test(c)) return "deadlift";
  if (/BENCH|PRESS BANCA/.test(c)) return "bench";
  if (/STRICT PRESS|SHOULDER PRESS|MILITARY/.test(c)) return "strictpress";
  if (/FRONT SQUAT/.test(c)) return "front";
  if (/BACK SPLIT SQUAT|BACK SQUAT/.test(c)) return "back";
  if (/PUSH PRESS/.test(c)) return "pushpress";
  if (/PUSH JERK/.test(c)) return "pushjerk";
  if (/JERK/.test(c)) return "jerk";
  if (/POWER CLEAN/.test(c)) return "powerclean";
  if (/CLEAN/.test(c)) return "clean";
  return null;
}
function rmOf(k){
  if (k === "cj"){ const a = rm.clean, b = rm.jerk; return a > 0 && b > 0 ? Math.min(a, b) : null; }
  return rm[k] > 0 ? +rm[k] : null;
}
// En complejos se usa el RM más bajo de los ejercicios que lo forman.
function baseFor(e){
  const keys = e.rm ? [e.rm] : e.name.toUpperCase().replace(/\(.*?\)/g,"").split("+").map(lift).filter(Boolean);
  if (!keys.length) return null;
  let best = null, missing = null;
  keys.forEach(k => { const v = rmOf(k); if (v == null){ missing = missing || k; return; } if (!best || v < best.v) best = {k, v}; });
  if (missing) return {k:missing, v:null};
  return best;
}
function parsePct(s){
  return s.split(/,\s*/).map(p => {
    const m = p.trim().match(/^(\d+(?:[.,]\d+)?)%\/(?:(\d+)x)?([\d+]+)$/);
    return m ? {pct:parseFloat(m[1].replace(",",".")), sets:m[2] ? +m[2] : 1, reps:m[3]} : {text:p.trim()};
  });
}
const kgFor = (base, pct) => Math.round(base * pct / 100 / step) * step;
// Colores de los discos del box. Los de menos de 5 kg se pintan más pequeños.
const PLATE_COLOR = {25:"red", 20:"blue", 15:"yellow", 10:"green", 7.5:"white", 5:"grey", 2.5:"red", 2:"blue", 1.5:"yellow", 1:"green", 0.5:"white"};
function platesFor(kg){
  let side = (kg - barKg) / 2; if (side < 0.25) return null;
  const out = [];
  [25,20,15,10,7.5,5,2.5,2,1.5,1,0.5].forEach(p => { while (side >= p - 1e-9){ out.push(p); side -= p; } });
  return out;
}
const n0 = x => String(x).replace(".", ",");
function plateHtml(kg){
  if (kg < barKg) return '<span>Barra técnica o más ligera</span>';
  const p = platesFor(kg); if (!p) return '<span>Barra sola</span>';
  return p.map(x => {
    const c = PLATE_COLOR[x] + (x < 5 ? " sm" : "");
    return `<span class="pl ${c}">${n0(x)}</span>`;
  }).join("") + '<span style="margin-left:4px">por lado</span>';
}
// Dibujo de la barra con los discos montados (vista lateral, los dos lados iguales).
// Tamaños: de 5 kg en adelante, bumper estándar (mismo diámetro, cambia el grosor);
// 1-2,5 kg, discos medianos; 0,5 kg, disco muy pequeño.
const PLATE_DIM = {25:[52,12], 20:[52,10], 15:[52,8.5], 10:[52,7], 7.5:[52,6], 5:[52,5],
                   2.5:[26,4], 2:[24,3.6], 1.5:[22,3.2], 1:[20,3], 0.5:[12,2.6]};
function barSvg(kg){
  if (kg < barKg) return "";
  const p = platesFor(kg) || [], H = 56, cy = H / 2, gap = 0.8;
  const load = p.reduce((a, x) => a + PLATE_DIM[x][1] + gap, 0);
  const shaft = 56, stop = 4, sleeve = Math.max(64, load + 14);
  const W = shaft + 2 * (stop + sleeve);
  const side = dir => {                       // dir = -1 izquierda, 1 derecha
    const x0 = W / 2 + dir * (shaft / 2);       // borde interior del tope
    const rect = (x, w, h, cls, rx) => `<rect class="${cls}" x="${(dir > 0 ? x : x - w).toFixed(1)}" y="${(cy - h/2).toFixed(1)}" width="${w}" height="${h}" rx="${rx || 0}"/>`;
    let out = rect(x0, stop, 16, "metal", 1);                 // tope del manguito
    out += rect(x0 + dir * stop, sleeve, 9, "metal", 1.5);    // manguito
    let x = x0 + dir * (stop + 1);
    p.forEach(w => {
      const [h, t] = PLATE_DIM[w];
      out += rect(x, t, h, "bp " + PLATE_COLOR[w], w >= 5 ? 2 : 1);
      x += dir * (t + gap);
    });
    if (p.length) out += rect(x + dir * 0.5, 3, 13, "clip", 1);   // cierre
    return out;
  };
  const label = p.length ? p.map(n0).join(" + ") + " kg por lado" : "Barra sola";
  return `<svg class="barsvg" viewBox="0 0 ${W.toFixed(1)} ${H}" width="${Math.round(W)}" height="${H}" role="img" aria-label="${label}">
    <rect class="metal" x="${(W/2 - shaft/2).toFixed(1)}" y="${cy - 2}" width="${shaft}" height="4" rx="2"/>${side(-1)}${side(1)}</svg>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Vistas ---------- */
const app = document.getElementById("app");
function colorOf(id){ return PROFILES.find(p => p.id === id).color; }

function renderHome(){
  const t = todayMid();
  app.innerHTML = `
    <div class="brand"><div><h1>Iria R.A.</h1><p>Elige perfil</p></div>
      <div class="hbtns"><button class="gear rm" data-act="rms">Mis RMs</button>${ARCH.length ? `<button class="gear arc" data-act="arclist">Archivo</button>` : ""}<button class="gear" data-act="settings">Ajustes</button></div></div>
    <div class="profiles">${PROFILES.map(p => {
      const pr = prog(p.id), ds = sessionDates(p.id);
      if (!pr.days.length) return `<button class="prof empty" style="--c:${p.color}" data-act="open" data-id="${p.id}">
          <div class="kind">${p.kind}</div><h2>${pr.name}</h2>
          <div class="next">Programación pendiente de cargar</div></button>`;
      if (!ds) return `<button class="prof" style="--c:${p.color}" data-act="settings">
          <div class="kind">${p.kind}</div><h2>${pr.name}</h2>
          <div class="next">Elige en ajustes qué días entrenas y la fecha de inicio</div></button>`;
      const i = currentIdx(p.id), d = ds[i];
      const label = !d ? "Próxima" : +d === +t ? "<b>Hoy</b>" : d > t ? "Próxima" : "Última";
      const wds = cfgOf(p.id).weekdays.slice().sort((a,b) => WD_ORDER.indexOf(a) - WD_ORDER.indexOf(b)).map(w => DIAS_L[w]).join(", ");
      return `<button class="prof" style="--c:${p.color}" data-act="open" data-id="${p.id}">
          <div class="kind">${p.kind}</div><h2>${pr.name}</h2>
          <div class="next">${label}: <b>Entreno ${pr.days[i].n}</b>${d ? " · " + DIAS_L[d.getDay()] + " " + fmtS(d) : ""}</div>
          <div class="sub">${pr.days.length} sesiones${wds ? " · " + wds : ""}</div>
          <div class="progress"><i style="width:${i/pr.days.length*100}%"></i></div></button>`;
    }).join("")}${boxCard()}</div>
    <p class="hint">Los RMs son comunes a Halterofilia y CrossFit. Todo se guarda en el móvil, dentro de la app.</p>`;
}

/* ---------- Nutrición ---------- */
const NUT = window.NUTRICION || null;
const SLOTS = [
  {k:"des", label:"Desayuno",     hora:"09:00"},
  {k:"mm",  label:"Media mañana", hora:"11:00"},
  {k:"com", label:"Comida",       hora:"14:00"},
  {k:"mer", label:"Merienda",     hora:"17:00"},
  {k:"cen", label:"Cena",         hora:"21:00"}
];
const wdIdx = d => (d.getDay() + 6) % 7;   // lunes = 0, como las semanas de los PDFs
function nutDays(){ const out = []; for (const d = parseDate(NUT.from); d <= parseDate(NUT.to); d.setDate(d.getDate() + 1)) out.push(iso(d)); return out; }
function nutToday(){ const t = iso(todayMid()); return t < NUT.from ? NUT.from : t > NUT.to ? NUT.to : t; }
// Cada desayuno distinto junto a su media mañana (los repetidos en varios días o PDFs salen una vez).
function nutBreakfasts(){
  const out = [], byKey = {};
  Object.keys(NUT.weeks).forEach(p => NUT.weeks[p].forEach((w, i) => {
    const k = w.des + "+" + w.mm;
    if (!byKey[k]) out.push(byKey[k] = {k, des:w.des, mm:w.mm, from:{}});
    (byKey[k].from[p] = byKey[k].from[p] || []).push(DIAS_L[(i + 1) % 7]);
  }));
  out.forEach(o => o.label = Object.keys(o.from).map(p => NUT.plans[p] + ": " + o.from[p].join(", ")).join(" · "));
  return out;
}
// Platos de un día según lo elegido: el desayuno arrastra la media mañana; la comida, la merienda y la cena.
function nutDay(ds){
  const sel = nut[ds] || {}, w = wdIdx(parseDate(ds));
  const b = sel.des ? nutBreakfasts().find(o => o.k === sel.des) : null;
  const pl = sel.com && NUT.weeks[sel.com] ? NUT.weeks[sel.com][w] : null;
  return {sel, w, des:b && [b.des], mm:b && [b.mm], com:pl && [pl.com], mer:pl && [pl.mer], cen:pl && pl.cen};
}
const dishName = id => esc(NUT.dishes[id].name);
function dishHtml(id){
  const d = NUT.dishes[id];
  return `<div class="dish"><h3>${esc(d.name)}</h3>
    <ul class="ing">${d.ing.map(i => `<li><span class="q">${esc(i.q)}</span> ${esc(i.n)}${i.x ? `<div class="xch"><b>Intercambios</b>${i.x.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}</li>`).join("")}</ul>
    ${d.steps ? `<details class="recipe"><summary>Ver receta</summary><ol>${d.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></details>` : ""}</div>`;
}
function nutCard(){
  if (!NUT) return "";
  const ds = nutToday(), d = parseDate(ds), m = nutDay(ds), t = iso(todayMid()), cita = parseDate(NUT.cita);

/* ---------- Leer la pizarra (reconocimiento de texto en el móvil, ML Kit) ---------- */
// Reparte el texto leído entre Fuerza y WOD buscando cabeceras típicas de la pizarra.
const RX_FUERZA = /^(fuerza|strength|str\b|heavy|complex|t[eé]cnica|technique|skill|lifting|halter|barbell|oly)/i;
const RX_WOD = /^(wod|metcon|amrap|emom|e\d+\s*mom|e\d[:.]\d+\s*mom|for\s*time|ft\b|rft\b|tabata|chipper|\d+\s*(rondas|rounds|rft)|por\s*tiempo|intervalos)/i;
const ONLY_HEADER = /^(fuerza|strength|wod|metcon|skill|t[eé]cnica|technique)\s*[:.\-]?$/i;
function parseBoard(raw){
  const lines = String(raw || "").split(/\r?\n/).map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  const out = {pre:[], fuerza:[], wod:[]}; let cur = "pre", seen = false;
  lines.forEach(l => {
    if (RX_FUERZA.test(l)){ cur = "fuerza"; seen = true; if (ONLY_HEADER.test(l)) return; }
    else if (RX_WOD.test(l)){ cur = "wod"; seen = true; if (ONLY_HEADER.test(l)) return; }
    out[cur].push(l);
  });
  if (!seen) return {wod: out.pre.join("\n")};
  if (out.pre.length) (out.wod.length ? out.fuerza : out.wod).unshift(...out.pre);
  const r = {fuerza: out.fuerza.join("\n"), wod: out.wod.join("\n")};
  const w = r.wod;
  r.tipo = /amrap/i.test(w) ? "AMRAP" : /for\s*time|\brft\b|por\s*tiempo/i.test(w) ? "For time"
    : /emom|e\d+\s*mom/i.test(w) ? "EMOM" : /tabata|intervalo|\bon\b.*\boff\b/i.test(w) ? "Intervalos"
    : /\d+\s*(rondas|rounds)/i.test(w) ? "Rondas" : "";
  return r;
}
// La app Android llama a esta función con el texto reconocido (o con un error).
window.onBoardText = (text, err) => {
  if (view.name !== "boxDay" || !view.draft) return;
  if (err){ view = {...view, scanMsg: err === "cancel" ? "" : err}; render(); return; }
  const r = parseBoard(text), d = view.draft;
  if (!r.fuerza && !r.wod){ view = {...view, scanMsg:"No he encontrado texto en la foto. Prueba con más luz y más cerca."}; render(); return; }
  ["fuerza", "wod"].forEach(f => { if (r[f]) d[f] = d[f] ? d[f] + "\n" + r[f] : r[f]; });
  if (r.tipo && !d.tipo) d.tipo = r.tipo;
  view = {...view, scanMsg:"Texto leído. Revísalo y corrige lo que haga falta antes de guardar."};
  render();
};

const resEdit = new Set();
const SAVE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V3z"/><path d="M8 3v5h7V3"/><rect x="8" y="13" width="8" height="6" rx="1"/></svg>';
const PENCIL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5l4 4L8 20H4v-4L16.5 3.5z"/><path d="M14 6l4 4"/></svg>';
// Línea de texto de una sesión que se puede tachar (WODs, gimnásticos, calentamientos…).
function tickRow(key, text){
  return `<div class="textrow tick${done[key] ? " done" : ""}" data-k="${key}" tabindex="0" role="checkbox" aria-checked="${!!done[key]}"><span class="tk" aria-hidden="true"></span><span class="tl">${esc(text)}</span></div>`;
}
function exHtml(id, di, e, ei){
  const b = e.pct ? baseFor(e) : null;
  let rows = "";
  if (e.pct){
    rows += parsePct(e.pct).map((r, j) => {
      if (r.text) return tickRow(`${id}|${di}|${ei}|p${j}`, r.text);
      const key = `${id}|${di}|${ei}|${j}`, kg = b && b.v != null ? kgFor(b.v, r.pct) : null;
      return `<div class="row${done[key] ? " done" : ""}" data-k="${key}" tabindex="0" role="checkbox" aria-checked="${!!done[key]}">
        <div class="pct">${n0(r.pct)}%</div>
        <div class="kg">${kg == null ? "—" : n0(kg)}<small>kg</small></div>
        <div class="right"><div class="sr">${r.sets} × ${r.reps}<span>${r.sets > 1 ? "series × reps" : "serie"}</span></div>
        <div class="plates">${kg == null ? "" : plateHtml(kg)}</div>${kg == null ? "" : barSvg(kg)}</div></div>`;
    }).join("");
  }
  const text = e.text ? (Array.isArray(e.text) ? e.text : [e.text]) : [];
  rows += text.map((l, j) => tickRow(`${id}|${di}|${ei}|t${j}`, l)).join("");
  let baseLine = "";
  if (b && b.v != null) baseLine = `<div class="base">Sobre ${RM_LABEL[b.k]} · RM ${n0(b.v)} kg</div>`;
  else if (b) baseLine = `<div class="base miss">Falta tu RM de ${RM_LABEL[b.k]}. Ponlo en ajustes.</div>`;
  else if (e.pct) baseLine = `<div class="base miss">No sé qué RM usar para este ejercicio.</div>`;
  const tspec = timerFor(e);
  return `<section class="ex${e.prep ? " prep" : ""}"><div class="ex-h"><div class="num">${e.tag != null ? esc(e.tag) : ei+1}</div><div>${e.title ? `<div class="extitle">${esc(e.title)}</div>` : ""}<h2>${esc(e.name)}</h2>${baseLine}</div>
    ${tspec ? `<button class="tbtn" data-act="timer" data-ei="${ei}" aria-label="Abrir timer: ${esc(tLabel(tspec))}">${CLOCK_SVG}<span>${esc(tLabel(tspec))}</span></button>` : ""}</div>

    ${rows ? `<div class="rows">${rows}</div>` : ""}
    ${e.prep || /WARM/.test(e.name) ? "" : (() => { const v = resultOf(id, di, e, ei), k = resKey(id, di, ei);
      if (v.trim() && !resEdit.has(k))   // guardado: se ve pero no se toca hasta pulsar el lápiz
        return `<div class="result"><div class="rhead"><span class="rl">Tu resultado</span>
          <button class="ibtn" data-act="resedit" data-k="${k}" aria-label="Editar resultado">${PENCIL_SVG}</button></div>

/* ---------- Timer ---------- */
// Cada bloque recibe un timer según su texto: EMOM / E2MOM / E 1:30 MOM, AMRAP, For time (con TC) o
// descanso entre series si es fuerza por porcentajes. Un bloque puede fijarlo a mano con "timer" en el programa:
//   {t:"emom", every:90, rounds:8} · {t:"amrap", min:15} · {t:"ft", cap:1200} · {t:"rest", secs:120} · {t:"seq", parts:[…]}
const PREP = 10;   // cuenta atrás antes de empezar
const CLOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5M12 2.5V5"/></svg>';
const clock = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const emomName = every => every === 60 ? "EMOM" : every % 60 ? `E ${clock(every)} MOM` : `E${every / 60}MOM`;
function parseTimerLine(s){
  let m;
  if ((m = s.match(/\bE\s*(\d+(?::\d{2})?)?\s*MOM\b/i))){
    const [a, b] = (m[1] || "1").split(":"), every = +a * 60 + (+b || 0);
    let r, rounds = null;
    if ((r = s.match(/(\d+)\s*(?:sets|series|rondas|rounds)\b/i))) rounds = +r[1];
    else if ((r = s.slice(m.index + m[0].length).match(/^\s*(\d+)\b/))) rounds = Math.round(+r[1] * 60 / every);
    return {t:"emom", every, rounds};
  }
  if ((m = s.match(/\bAMRAP\s*(\d+)/i))) return {t:"amrap", min:+m[1]};
  if ((m = s.match(/^\s*(?:rest|descanso)\s*(\d+)(?::(\d{2}))?/i))) return {t:"rest", secs:+m[1] * 60 + (+m[2] || 0)};
  return null;
}
// "Descanso: 2 min tras el 70 % y el 80 %, 3 min tras el 90 %." / "Descanso de 3 min entre bloques."
function restsFromNotes(notes){
  const map = {}; let all = 0, m;
  const re = /(\d+)\s*min\s+tras\s+((?:el\s*)?\d+\s*%(?:\s*(?:,|y)\s*(?:el\s*)?\d+\s*%)*)/gi;
  while ((m = re.exec(notes || ""))) m[2].match(/\d+/g).forEach(p => map[p] = +m[1] * 60);
  if ((m = (notes || "").match(/(\d+)\s*min\s+entre\s+bloques/i))) all = +m[1] * 60;
  return {map, all};
}
// EMOM por bloques de porcentaje: cada bloque son tantas rondas como series, con su descanso entre medias.
function emomFromPct(e, every){
  const rs = restsFromNotes(e.notes), parts = []; let prev = null;
  parsePct(e.pct).forEach(r => {
    const p = r.text ? parseTimerLine(r.text) : {t:"emom", every, rounds:r.sets, label:n0(r.pct) + " %"};
    if (!p || p.t !== "emom") return;
    p.rounds = p.rounds || 1;
    if (parts.length){ const rest = (prev != null && rs.map[prev]) || rs.all; if (rest) parts.push({t:"rest", secs:rest}); }
    parts.push(p); prev = r.text ? null : r.pct;
  });
  return parts.length === 1 ? parts[0] : parts.length ? {t:"seq", parts} : null;
}
function timerFor(e){
  if (e.timer) return e.timer;
  if (e.prep || /WARM/i.test(e.name)) return null;
  const text = e.text ? [].concat(e.text) : [], head = [e.title, e.name].filter(Boolean).join(" · ");
  const all = [head, ...text].join(" · ");
  if (/for\s*time|time\s*cap|\bTC\s*\d/i.test(all)){
    const m = all.match(/(?:\bTC|time\s*cap)\D{0,12}(\d+)(?:\s*-\s*(\d+))?/i) || all.match(/(\d+)\s*min(?:utos)?\s+para\b/i);
    return {t:"ft", cap:m ? +(m[2] || m[1]) * 60 : 0};
  }
  const hp = parseTimerLine(head);
  const parts = text.map(parseTimerLine).filter(Boolean);
  parts.forEach(p => { if (p.t === "emom" && !p.rounds) p.rounds = (hp && hp.rounds) || 10; });
  if (parts.length) return parts.length === 1 ? parts[0] : {t:"seq", parts};
  if (hp && hp.t === "emom" && !hp.rounds) return (e.pct && emomFromPct(e, hp.every)) || {...hp, rounds:10};
  if (hp) return hp;
  if (e.pct) return {t:"rest", secs:120};
  return null;
}
function phasesOf(s){
  if (s.t === "seq") return s.parts.flatMap(phasesOf);
  if (s.t === "emom") return Array.from({length:s.rounds}, (_, i) => ({name:emomName(s.every) + (s.label ? " · " + s.label : ""), sub:`Ronda ${i + 1} de ${s.rounds}`, secs:s.every}));
  if (s.t === "amrap") return [{name:"AMRAP", sub:`${s.min} minutos`, secs:s.min * 60}];
  if (s.t === "rest") return [{name:"Descanso", sub:"", secs:s.secs, rest:true}];
  return [];
}
const totalOf = s => phasesOf(s).reduce((a, p) => a + p.secs, 0);
function tLabel(s){
  if (s.t === "emom") return `${emomName(s.every)} × ${s.rounds}`;
  if (s.t === "amrap") return `AMRAP ${s.min}'`;
  if (s.t === "ft") return s.cap ? `For time · TC ${clock(s.cap)}` : "For time";
  if (s.t === "rest") return `Descanso ${clock(s.secs)}`;
  const work = s.parts.filter(p => p.t !== "rest");
  return `${work.every(p => p.t === "emom") ? "EMOM · " : ""}${work.length} bloques · ${clock(totalOf(s))}`;
}

// Estado del timer abierto. elapsed() cuenta desde que se pulsa Empezar, incluida la cuenta atrás.
let tm = null, actx = null;
const tmEl = document.getElementById("tm");
function beep(len, freq){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.frequency.value = freq; g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + len);
  } catch(_) {}
}
const tmPrep = () => tm.spec.t === "rest" ? 0 : PREP;
const tmElapsed = () => tm.acc + (tm.state === "run" ? (Date.now() - tm.t0) / 1000 : 0);
/* ---------- Contador de series (descansos con rampa de %) ----------
   En los ejercicios con % el timer de descanso lleva la cuenta: cada serie se marca con «Serie hecha»,
   arranca el descanso y al acabar enseña la siguiente con su peso. El avance se guarda (e-sets). */
function setsFor(ctx){
  if (!ctx) return null;
  const e = prog(ctx.id).days[ctx.di].ex[ctx.ei]; if (!e || !e.pct) return null;
  const b = baseFor(e), out = [];
  parsePct(e.pct).forEach((r, j) => { if (r.text) return;
    for (let k = 1; k <= r.sets; k++) out.push({j, k, n:r.sets, pct:r.pct, reps:r.reps, kg:b && b.v != null ? kgFor(b.v, r.pct) : null}); });
  return out.length ? out : null;
}
const setKey = c => `${c.id}|${c.di}|${c.ei}`;
function setsSync(){   // guarda el avance y marca como hechas las filas completas de la sesión
  const c = tm.ctx; setProg[setKey(c)] = tm.si; save("e-sets", setProg);
  const rows = [...new Set(tm.sets.map(x => x.j))];
  rows.forEach(j => { const last = tm.sets.reduce((a, x, i) => x.j === j ? i : a, -1), k = `${c.id}|${c.di}|${c.ei}|${j}`;
    if (tm.si > last) done[k] = true; else delete done[k]; });
  save("e-done", done);
}
function setsRestTick(){
  if (!tm || tm.mode !== "rest") return;
  const left = (tm.rEnd - Date.now()) / 1000, sec = Math.ceil(left);
  if (left <= 0){ clearInterval(tm.siv); beep(0.6, 1320); tm.mode = "work"; tmRender(); return; }
  if (sec <= 3 && tm.key !== sec){ tm.key = sec; beep(0.15, 880); }
  const c = tmEl.querySelector(".tm-clock"); if (c) c.textContent = clock(sec);
  const pg = tmEl.querySelector(".progress i"); if (pg) pg.style.width = (100 - left / tm.rLen * 100) + "%";
}
function setLine(x){ return `${n0(x.pct)} % · ${x.reps} reps${x.n > 1 ? ` · ${x.k}ª de ${x.n}` : ""}`; }
function setsDots(){
  const groups = []; tm.sets.forEach((x, i) => { (groups[x.j] = groups[x.j] || {pct:x.pct, items:[]}).items.push(i); });
  return `<div class="sdots" aria-hidden="true">${groups.filter(Boolean).map(g => `<div class="g"><span>${g.items.map(i =>
    `<i class="${i < tm.si ? "d" : ""} ${i === tm.si && tm.mode === "work" ? "cur" : ""}"></i>`).join("")}</span><small>${n0(g.pct)}%</small></div>`).join("")}</div>`;
}
function tmSetsRender(){
  const s = tm.spec, N = tm.sets.length, top = `<div class="tm-top"><div class="ttl">Serie ${Math.min(tm.si + 1, N)} de ${N}<small>${esc(tm.title)}</small></div><button data-tm="close" aria-label="Cerrar timer">✕</button></div>`;
  if (tm.si >= N){
    tmEl.className = "tm";
    tmEl.innerHTML = `${top}<div class="tm-main"><div class="tm-name">Ejercicio terminado</div><div class="tm-sub">${N} de ${N} series hechas</div>${setsDots()}</div>
      <div class="tm-btns"><button class="btn" data-tm="close">Cerrar</button><button class="btn ghost" data-tm="sundo">Deshacer última</button><button class="btn ghost" data-tm="sreset">Empezar de nuevo</button></div>`;
    return;
  }
  const x = tm.sets[tm.si];
  if (tm.mode === "rest"){
    const prevDone = tm.sets[tm.si - 1];
    tmEl.className = "tm rest";
    tmEl.innerHTML = `${top}<div class="tm-main"><div class="tm-name">Descanso</div>
      <div class="tm-sub">Hecha la serie ${tm.si} de ${N}${prevDone ? ` (${setLine(prevDone)})` : ""}</div>
      <div class="tm-clock">${clock(Math.ceil((tm.rEnd - Date.now()) / 1000))}</div>
      <div class="tm-next">Siguiente: serie ${tm.si + 1} · ${x.kg != null ? n0(x.kg) + " kg · " : ""}${setLine(x)}</div>
      <div class="progress"><i></i></div>${setsDots()}</div>
      <div class="tm-btns"><button class="btn" data-tm="sskip">Empezar ya</button><button class="btn ghost" data-tm="splus">+15 s</button><button class="btn ghost" data-tm="sundo">Deshacer</button></div>`;
    setsRestTick();
    return;
  }
  tmEl.className = "tm";
  tmEl.innerHTML = `${top}<div class="tm-main"><div class="tm-name">Serie ${tm.si + 1} de ${N}</div>
    <div class="tm-kg">${x.kg != null ? n0(x.kg) + "<small>kg</small>" : "—"}</div>
    <div class="tm-sub">${setLine(x)}</div>
    ${x.kg != null ? `<div class="plates">${plateHtml(x.kg)}</div>${barSvg(x.kg)}` : ""}
    ${setsDots()}
    <div class="tm-adj">${tmAdjHtml(s)}</div></div>
    <div class="tm-btns"><button class="btn" data-tm="sdone">Serie hecha</button>${tm.si > 0 ? `<button class="btn ghost" data-tm="sundo">Deshacer</button>` : ""}</div>`;
}
function setsAction(a){
  const N = tm.sets.length;
  if (a === "sdone"){
    tm.si++; setsSync();
    if (tm.si >= N){ beep(0.9, 1320); tm.mode = "work"; }
    else { tm.mode = "rest"; tm.rLen = tm.spec.secs; tm.rEnd = Date.now() + tm.spec.secs * 1000; tm.key = null; beep(0.05, 660);
      clearInterval(tm.siv); tm.siv = setInterval(setsRestTick, 200); }
  } else if (a === "sundo"){ clearInterval(tm.siv); tm.si = Math.max(0, tm.si - 1); tm.mode = "work"; setsSync(); }
  else if (a === "sskip"){ clearInterval(tm.siv); tm.mode = "work"; }
  else if (a === "splus"){ tm.rEnd += 15000; tm.rLen += 15; }
  else if (a === "sreset"){ tm.si = 0; tm.mode = "work"; setsSync(); }
  tmRender();
}

function tmOpen(spec, title, ctx){
  tm = {spec:JSON.parse(JSON.stringify(spec)), title, ctx, state:"idle", acc:0};
  if (tm.spec.t === "rest"){
    const sets = setsFor(ctx);
    if (sets){
      tm.sets = sets; tm.mode = "work";
      const saved = setProg[setKey(ctx)];
      tm.si = saved != null ? Math.min(saved, sets.length)
        : Math.max(0, sets.findIndex(x => !done[`${ctx.id}|${ctx.di}|${ctx.ei}|${x.j}`])) ;
      if (saved == null && sets.every(x => done[`${ctx.id}|${ctx.di}|${ctx.ei}|${x.j}`])) tm.si = sets.length;
    }
  }
  tmEl.style.setProperty("--c", app.style.getPropertyValue("--c") || "var(--accent)");
  tmEl.hidden = false; tmRender();
}
function tmClose(){ if (!tm) return; const hadSets = !!tm.sets; clearInterval(tm.iv); clearInterval(tm.siv); tm = null; tmEl.hidden = true; tmEl.innerHTML = ""; if (hadSets) render(); }
function tmStart(){ clearInterval(tm.iv); tm.acc = 0; tm.t0 = Date.now(); tm.state = "run"; tm.key = null; tm.ph = null; beep(0.05, 660); tm.iv = setInterval(tmTick, 100); tmRender(); }
function tmStop(){ clearInterval(tm.iv); tm.state = "idle"; tm.acc = 0; tmRender(); }
function tmPause(){ tm.acc = tmElapsed(); tm.state = "pause"; tmRender(); }
function tmResume(){ tm.t0 = Date.now(); tm.state = "run"; tmRender(); }
function tmFinish(){ tm.acc = tmElapsed(); clearInterval(tm.iv); tm.state = "done"; tm.final = Math.max(0, tm.acc - tmPrep()); tmRender(); }
// Qué se ve en este momento: fase, subtítulo, reloj y avance.
function tmNow(){
  const s = tm.spec, el = tmElapsed(), prep = tmPrep();
  if (el < prep) return {cls:"prep", name:"Prepárate", sub:"Empieza en", left:prep - el, ph:-1, next:s.t === "ft" ? "For time" : phasesOf(s)[0].name};
  const t = el - prep;
  if (s.t === "ft"){
    if (s.cap && t >= s.cap) return {done:true};
    return {name:"For time", sub:s.cap ? "Time cap " + clock(s.cap) : "Sin time cap", up:t, ph:0, frac:s.cap ? t / s.cap : null};
  }
  const ps = phasesOf(s), total = totalOf(s); let acc = 0;
  for (let i = 0; i < ps.length; i++){
    const p = ps[i];
    if (t < acc + p.secs){ const n = ps[i + 1];
      return {cls:p.rest ? "rest" : "", name:p.name, sub:p.sub, left:acc + p.secs - t, ph:i, frac:t / total, next:n ? `Siguiente: ${n.name}${n.rest ? " " + clock(n.secs) : ""}` : "Último tramo"}; }
    acc += p.secs;
  }
  return {done:true};
}
function tmTick(){
  if (!tm || tm.state !== "run") return;
  const n = tmNow();
  if (n.done){ beep(0.9, 1320); tmFinish(); return; }
  if (n.left != null){ const sec = Math.ceil(n.left), k = n.ph + ":" + sec;
    if (sec <= 3 && tm.key !== k){ tm.key = k; beep(0.15, 880); } }
  if (tm.ph !== n.ph){ if (tm.ph != null) beep(0.6, 1320); tm.ph = n.ph; }
  tmPaint(n);
}
function tmPaint(n){
  tmEl.className = "tm " + (n.cls || "") + (tm.state === "pause" ? " paused" : "");
  const q = s => tmEl.querySelector(s);
  q(".tm-name").textContent = n.name; q(".tm-sub").textContent = n.sub || "";
  q(".tm-clock").textContent = clock(n.up != null ? Math.floor(n.up) : Math.ceil(n.left));
  q(".tm-next").textContent = n.next || "";
  q(".progress i").style.width = (n.frac == null ? 0 : Math.min(1, n.frac) * 100) + "%";
}
function tmPlanHtml(s){
  const parts = s.t === "seq" ? s.parts : [s];
  return `<div class="tm-plan">${parts.map(p => `<div class="${p.t === "rest" ? "r" : ""}"><span>${esc(p.t === "rest" ? "Descanso" : tLabel(p) + (p.label ? " · " + p.label : ""))}</span><span>${clock(p.t === "ft" ? p.cap : totalOf(p))}</span></div>`).join("")}</div>`;
}
function tmAdjHtml(s){

  if (s.t === "emom") return st("every", "Cada", clock(s.every)) + st("rounds", "Rondas", s.rounds);
  if (s.t === "amrap") return st("min", "Minutos", s.min);
  if (s.t === "ft") return st("cap", "Time cap", s.cap ? clock(s.cap) : "No");

}
function tmRender(){

  if (tm.state === "idle"){
    tmEl.className = "tm";
    tmEl.innerHTML = `${top}<div class="tm-main">
      <div class="tm-name">${s.t === "rest" ? "Descanso" : "Listo"}</div>
      <div class="tm-sub">${s.t === "rest" ? "Arranca al pulsar, sin cuenta atrás" : `Cuenta atrás de ${PREP} s y empieza`}</div>
      <div class="tm-clock">${clock(s.t === "ft" ? (s.cap || 0) : totalOf(s))}</div>
      ${s.t === "seq" ? tmPlanHtml(s) : `<div class="tm-adj">${tmAdjHtml(s)}</div>`}
    </div><div class="tm-btns"><button class="btn" data-tm="start">Empezar</button></div>`;
    return;

      <div class="tm-clock">${clock(ft ? Math.floor(tm.final) : totalOf(s))}</div></div>
      <div class="tm-btns">${ft && tm.ctx && !capped ? `<button class="btn" data-tm="note">Anotar tiempo</button>` : ""}

    <div class="tm-btns">
      ${tm.state === "run" ? `<button class="btn" data-tm="pause">Pausa</button>` : `<button class="btn" data-tm="resume">Seguir</button>`}
      ${s.t === "ft" ? `<button class="btn" data-tm="finish">Terminé</button>` : ""}
      <button class="btn ghost" data-tm="restart">Reiniciar</button><button class="btn ghost" data-tm="stop">Parar</button></div>`;

}
const TM_STEP = {every:15, rounds:1, min:1, cap:60, secs:15};
tmEl.addEventListener("click", e => {
  const b = e.target.closest("[data-tm]"); if (!b || !tm) return;
  const a = b.dataset.tm, s = tm.spec;
  if (tm.sets && /^s(done|undo|skip|plus|reset)$/.test(a)) return setsAction(a);
  if (a === "close") tmClose();
  else if (a === "start" || a === "restart") tmStart();

});

const ARCH = window.ARCHIVO || [];
const archById = id => ARCH.find(p => p.id === id);
const archWord = p => p.tests ? "Test" : "Entreno";
function archCard(){
  if (!ARCH.length) return "";
  const progs = ARCH.filter(p => !p.tests), tests = ARCH.find(p => p.tests);
  const n = progs.reduce((a, p) => a + p.days.length, 0);
  return `<button class="prof" style="--c:var(--arc)" data-act="arclist">
      <div class="kind">Consulta</div><h2>Archivo</h2>
      <div class="next">${progs.length} ${progs.length === 1 ? "programación anterior" : "programaciones anteriores"}${tests ? ` · ${tests.days.length} tests` : ""}</div>
      <div class="sub">${n} sesiones con tus resultados</div></button>`;
}
// Busca un texto en nombres, líneas y resultados de los bloques (sin tildes ni mayúsculas).
const norm = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function archMatch(d, q){
  if (!q) return true;
  return d.ex.some(e => [e.name, e.title, ...(e.text || []), ...(e.result || [])].some(t => norm(t).includes(q)))
    || norm(d.desc).includes(q) || norm(d.tc).includes(q);
}
function archRange(p){
  const ds = p.days.map(d => d.date).filter(Boolean).sort();
  if (!ds.length) return "";
  const a = parseDate(ds[0]), b = parseDate(ds[ds.length - 1]);
  return `${fmtS(a)} – ${fmt(b)}`;
}
function renderArchList(){
  app.style.setProperty("--c", "var(--arc)");
  app.innerHTML = `<div class="bar"><button data-act="home" aria-label="Volver">‹ Inicio</button><div class="mid"><div class="ttl">Archivo</div><div class="when">Programaciones anteriores</div></div></div>
    <div class="profiles">${ARCH.map(p => `<button class="prof" style="--c:${p.tests ? "var(--rmc)" : "var(--arc)"}" data-act="arcprog" data-id="${esc(p.id)}">
      <div class="kind">${p.tests ? "Tests" : "Programación"}</div><h2>${esc(p.name)}</h2>
      <div class="next">${p.days.length} ${p.tests ? "tests" : "sesiones"} · ${esc(p.sub || "")}</div><div class="sub">${archRange(p)}</div></button>`).join("")}</div>`;
}
function renderArchProg(){
  app.style.setProperty("--c", "var(--arc)");
  const p = archById(view.id), q = norm(view.q || "").trim();
  let lastMonth = "", shown = 0;
  const list = p.days.map((d, i) => {
    if (!archMatch(d, q)) return "";
    shown++;
    const dt = d.date ? parseDate(d.date) : null, month = dt ? MESES[dt.getMonth()] + " " + dt.getFullYear() : "";
    const head = month !== lastMonth ? `<h3 class="arcmonth">${month}</h3>` : ""; lastMonth = month;
    const res = d.ex.filter(e => e.result && !e.prep).map(e => e.result[0]).slice(0, 2).join(" · ");
    return `${head}<button class="slot" data-act="arcday" data-i="${i}"><span class="hora">${dt ? fmtS(dt) : ""}</span>
      <span class="sl">${archWord(p)} ${d.n}</span><span class="sv">${esc(d.desc || d.tc || "")}${res ? `<div class="arcres">${esc(res)}</div>` : ""}</span></button>`;
  }).join("");
  app.innerHTML = `<div class="bar"><button data-act="arclist" aria-label="Volver">‹</button><div class="mid"><div class="ttl">${esc(p.name)}</div><div class="when">${esc(p.sub || "")}</div></div></div>
    <div class="field arcsearch"><label for="arc-q">Buscar en ${p.tests ? "los tests" : "esta programación"}</label>
      <input id="arc-q" type="search" placeholder="Por ejemplo: deadlift, snatch, Fran…" value="${esc(view.q || "")}"></div>
    <p class="arcsum" id="arc-n">${q ? `${shown} de ${p.days.length} ${p.tests ? "tests" : "sesiones"}` : `${p.days.length} ${p.tests ? "tests" : "sesiones"}`}</p>
    <div class="slots">${list || `<div class="emptybox">No hay ninguna sesión con «${esc(view.q)}».</div>`}</div>`;
}
function archExHtml(e, ei){
  const text = e.text ? [].concat(e.text) : [], res = e.result ? [].concat(e.result) : [];
  return `<section class="ex${e.prep ? " prep" : ""}"><div class="ex-h"><div class="num">${e.tag != null ? esc(e.tag) : ei + 1}</div><div>${e.title ? `<div class="extitle">${esc(e.title)}</div>` : ""}<h2>${esc(e.name)}</h2></div></div>
    ${e.notes ? `<div class="note">${esc(e.notes)}</div>` : ""}
    ${text.length ? `<div class="rows">${text.map(l => `<div class="textrow">${esc(l)}</div>`).join("")}</div>` : ""}
    ${res.length ? `<div class="result"><span class="rl">Tu resultado</span><div class="rv">${res.map(esc).join("<br>")}</div></div>` : ""}</section>`;
}
function renderArchDay(){
  app.style.setProperty("--c", "var(--arc)");
  const p = archById(view.id), i = view.i, d = p.days[i], dt = d.date ? parseDate(d.date) : null;

      <div class="progress"><i style="width:${(i + 1) / p.days.length * 100}%"></i></div></header>
    <main>${d.ex.map(archExHtml).join("")}</main>`;

/* ---------- Rutina diaria ---------- */
const rutDone = k => rutItems.filter(it => (rut[k] || {})[it.id]).length;
function rutCard(){
  const k = iso(todayMid()), n = rutDone(k), N = rutItems.length;
  return `<button class="prof" style="--c:var(--rut)" data-act="rutina">
      <div class="kind">Hoy</div><h2>Rutina diaria</h2>
      <div class="next">${N ? `<b>${n} de ${N}</b> ${n === N ? "· todo hecho" : "hechas"}` : "Añade tus tareas en Ajustes"}</div>
      <div class="progress"><i style="width:${N ? n / N * 100 : 0}%"></i></div></button>`;
}
function renderRutina(){
  app.style.setProperty("--c", "var(--rut)");
  const t = todayMid(), k = view.d || iso(t), dk = parseDate(k), isToday = k === iso(t);
  const shift = n => { const d = new Date(dk); d.setDate(d.getDate() + n); return iso(d); };
  const mon = new Date(dk); mon.setDate(mon.getDate() - ((dk.getDay() + 6) % 7));
  const week = Array.from({length:7}, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  const N = rutItems.length, n = rutDone(k);
  app.innerHTML = `<div class="bar"><button data-act="home" aria-label="Volver">‹ Inicio</button><div class="mid"><div class="ttl">Rutina diaria</div><div class="when">${n} de ${N} hechas</div></div></div>
    <div class="rutnav"><button data-act="rutday" data-d="${shift(-1)}" aria-label="Día anterior">‹</button>
      <div class="mid"><b>${isToday ? "Hoy" : DIAS_L[dk.getDay()]}</b><span>${DIAS_L[dk.getDay()]} ${fmt(dk)}</span></div>
      <button data-act="rutday" data-d="${shift(1)}" aria-label="Día siguiente" ${k >= iso(t) ? "disabled" : ""}>›</button></div>
    <div class="progress" style="--c:var(--rut)"><i style="width:${N ? n / N * 100 : 0}%"></i></div>
    <div class="ruts">${rutItems.map(it => { const on = !!(rut[k] || {})[it.id];
      return `<button class="rutck${on ? " on" : ""}" data-act="rutck" data-id="${esc(it.id)}" role="checkbox" aria-checked="${on}"><span class="bx"></span><span class="lb">${esc(it.label)}</span></button>`; }).join("")
      || `<div class="emptybox">Todavía no hay tareas. Añádelas en Ajustes → Rutina diaria.</div>`}</div>
    <div class="rutweek">${week.map(d => { const dkk = iso(d), m = rutDone(dkk), fut = d > t;
      return `<button data-act="rutday" data-d="${dkk}" class="${dkk === k ? "cur" : ""}" ${fut ? "disabled" : ""}>${DIAS_C[d.getDay()]}<b>${d.getDate()}</b>
        <span class="meter"><i style="width:${N && !fut ? m / N * 100 : 0}%"></i></span></button>`; }).join("")}</div>
    <div class="tools"><button class="btn ghost" data-act="settings">Editar la lista</button></div>`;
}
