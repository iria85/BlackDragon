name: Compilar APK
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Versión desde el tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=BlackDragon-$VERSION.apk" >> "$GITHUB_ENV"
      - run: gradle :app:assembleRelease -PappVersionName="$VERSION" -PappVersionCode=$((100 + GITHUB_RUN_NUMBER))
      - run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: BlackDragon-${{ env.VERSION }}
          path: app/build/outputs/apk/release/${{ env.APK }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/${{ env.APK }}